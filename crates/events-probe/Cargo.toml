# SPDX-License-Identifier: MIT

[package]
name = "events-probe"
description = "A throwaway Kafka consumer, run only inside the contract harness, to measure the consumer-side cost (gluon ADR 0028 decision 8)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dependencies]
axum = "0.8"
kafka-client = { version = "0.1.0", path = "../../../../lib/gluon-rs/crates/kafka-client" }
kafka-event-consumer = { version = "0.1.0", path = "../../../../lib/gluon-rs/crates/kafka-event-consumer" }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
telemetry = { version = "0.1.0", path = "../../../../lib/gluon-rs/crates/telemetry" }
user-client = { version = "0.1.0", path = "../../../../lib/gluon-rs/crates/user-client" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
