# SPDX-License-Identifier: MIT

[package]
name = "user-service"
description = "The user-service binary: the wire-compatible port of the Scala user-service (gluon ADR 0028)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
telemetry = { path = "../telemetry" }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
axum = "0.8"
base64 = "0.22"
bytes = "1"
pbkdf2 = { version = "0.12", features = ["hmac"] }
rand = "0.9"
schemars = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "uuid", "time", "json"] }
subtle = "2"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "trace"] }
prost = "0.14"
serde_yaml = "0.9"
tempfile = "3"
ureq = "3"
