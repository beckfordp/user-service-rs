# SPDX-License-Identifier: MIT

[package]
name = "telemetry"
description = "Cross-cutting behaviour every service needs: tracing, metrics, the log format and the error envelope; the seed of a Rust purerest equivalent (gluon ADR 0028 decision 4)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", default-features = false }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
reqwest = { version = "0.12", default-features = false }
schemars = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["fs", "time"] }
uuid = "1"

[dev-dependencies]
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "testing"] }
serde_json = "1"
tempfile = "3"
time = { version = "0.3", features = ["macros", "parsing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tower = { version = "0.5", features = ["util"] }
